# Dependency vulnerability scan on pull requests, using Google's OSV-Scanner.
# Reports only vulnerabilities the PR introduces, compared with the target branch.
# https://google.github.io/osv-scanner/github-action/
name: OSV-Scanner PR Scan

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  # Required to upload SARIF results to the Security tab
  security-events: write
  # Only needed in private repositories
  actions: read
  contents: read

jobs:
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0"
    with:
      # Scans package-lock.json and productvideos/pipeline/package-lock.json
      scan-args: |-
        --recursive
        ./
