# Unit and integration tests (pipeline/test/). See README "Tests".
#   - unit: pure functions, no ffmpeg, no network;
#   - integration: the real CLIs end to end (author -> script -> scenario, and
#     cards.mjs with the presenter avatar on and off), with ffmpeg and
#     synthetic clips. Neither calls a text-to-speech API, a browser or an app.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration
